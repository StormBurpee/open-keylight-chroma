name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev clang lld llvm python3-jsonschema
      - run: cmake -S . -B build/host -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" && cmake --build build/host && ctest --test-dir build/host --output-on-failure
      - run: python3 tests/config/test_contract.py && python3 tests/services/test_recovery_contract.py
      - run: python3 tests/release/test_package_esp.py
      - run: python3 firmware-nxp/build.py
  interfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            integrations/streamdeck/package-lock.json
            installer/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: dashboard
      - run: npm ci && npm run build && npm test && npm run validate && npm run pack
        working-directory: integrations/streamdeck
      - run: npm ci && npm test && npm run check && npm run bundle && npm run test:bundle
        working-directory: installer
      - run: python3 installer/tests/test_capture_demo.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-assets
          path: dashboard/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guided-installer
          path: installer/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streamdeck-plugin
          path: integrations/streamdeck/dist/*.streamDeckPlugin
          if-no-files-found: error
  esp32:
    needs: interfaces
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-assets
          path: dashboard/dist
      - run: . /opt/esp/idf/export.sh && idf.py build
        shell: bash
        working-directory: firmware
      - name: Package application with matching symbols and provenance
        run: >-
          python3 tools/package_esp.py --build-dir firmware/build
          --dashboard-manifest dashboard/dist/asset-manifest.json
          --commit "$GITHUB_SHA" --output build/release/esp32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32-development-image
          path: build/release/esp32
          if-no-files-found: error
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci; if ($LASTEXITCODE) { exit $LASTEXITCODE }; npm test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; npm run check; if ($LASTEXITCODE) { exit $LASTEXITCODE }; npm run bundle; if ($LASTEXITCODE) { exit $LASTEXITCODE }; npm run test:bundle; exit $LASTEXITCODE
        working-directory: installer
      - run: python -W error::ResourceWarning -m unittest discover -s tests/migration -p 'test_*.py'
      - run: python tests/release/test_package_release.py
      - run: python tests/release/test_windows_launcher.py
